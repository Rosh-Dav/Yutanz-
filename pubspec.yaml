name: ytanalyzer
description: A Flutter app for analyzing YouTube data

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.0.5
  fl_chart: ^0.68.0
  dart_sentiment: ^0.0.7
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.13.3
  url_launcher: ^6.2.1
  flutter_animate: ^4.5.0  
  shimmer: ^3.0.0  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/